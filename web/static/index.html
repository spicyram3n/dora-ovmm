<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DORA</title>
<link rel="stylesheet" href="style.css">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/examples/jsm/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
  "urdf-loader": "https://cdn.jsdelivr.net/npm/urdf-loader@0.12.3/src/URDFLoader.js"
} }
</script>
</head>
<body>
<header>
  <div class="brand">DORA <span>ovmm</span></div>
  <form id="query">
    <input id="target" placeholder="What should I fetch?" autocomplete="off">
    <input id="furniture" placeholder="at furniture (optional)" autocomplete="off" size="18"
           title="A furniture node id, or a unique name or label. With an object: search only there. Alone: just drive there.">
    <button id="go">Fetch</button>
  </form>
  <div class="status"><span class="dot" id="status-dot"></span><span id="status">connecting</span></div>
  <button class="ghost" id="reset" title="Start the page over; stops a running mission first. Saved runs are kept.">Reset</button>
</header>
<main>
  <aside class="card">
    <h2>Mission tree</h2>
    <div class="tree" id="tree"><p class="empty">Appears when a query runs.</p></div>
    <h2 class="runs-title">Runs</h2>
    <div class="tree"><ul id="runs"></ul></div>
  </aside>
  <section class="card">
    <nav id="tabs">
      <button data-stage="home"><span class="dot"></span>1 · Home</button>
      <button data-stage="navigate"><span class="dot"></span>2 · Navigate</button>
    </nav>
    <div class="stage">
      <div class="view" id="home">
        <div class="caption" id="home-caption"></div>
      </div>
      <div class="view" id="navigate"><div class="caption" id="nav-caption"></div></div>
      <div class="reasoner" id="reasoner" hidden></div>
      <!-- Over every stage, like the reasoner: the operator's controls are always in reach. -->
      <div class="corner-group">
        <button class="corner" id="home-button" title="Fold the arm home. No collision check: only with the hand empty and clear.">Home arm</button>
        <button class="corner" id="open-button" title="Open the hand fully">Open hand</button>
        <button class="corner" id="close-button" title="Close the hand with the grasp effort">Close hand</button>
        <button class="corner" id="recover-button" title="After a failed pick: open the hand, back straight out, then plan the arm home. Resumes Nav2.">Recover arm</button>
        <button class="corner" id="nav2-button" title="The mission pauses Nav2 for the pick and the next mission resumes it. Resume it here to send RViz goals in between; pause it to be sure the base stays put.">Nav2</button>
      </div>
    </div>
    <footer id="log">&nbsp;</footer>
  </section>
  <div class="side">
    <section class="card">
      <div class="card-head"><h2>Head camera</h2><span class="badge" id="camera-badge">no signal</span></div>
      <div class="feed">
        <img id="camera" alt="head camera" hidden>
        <p class="empty" id="camera-note">Waiting for the head camera</p>
      </div>
      <footer id="camera-topic">&nbsp;</footer>
    </section>
    <!-- The object's points and the top grasps, from core.grasping.pick's "grasps" event. -->
    <section class="card">
      <div class="card-head"><h2>GraspGenX poses</h2><span class="badge" id="grasp-badge">none yet</span></div>
      <div class="feed" id="grasp-view">
        <p class="empty" id="grasp-note">The top-scored grasps appear here once a pick starts</p>
      </div>
      <footer id="grasp-info">&nbsp;</footer>
    </section>
  </div>
</main>

<script type="module" src="app.js"></script>
</body>
</html>
