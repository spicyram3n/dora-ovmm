# Nav2's global planner on a saved map, with no robot: no scan, no localisation,
# no controller. Only map_server and planner_server run, so a path here is the
# planner's own answer, not a replay of a drive.
#
# Differences from config/nav2/nav2_params.yaml (the simulation stack):
#   use_sim_time      false   nothing publishes /clock offline
#   obstacle_layer    dropped there is no live /scan; the static map is all there is
#   allow_unknown     false   the lab map is 86% unknown, and a path straight
#                             through unmapped space would prove nothing
# Everything else (Theta*, its weights, robot_radius, inflation) is copied from
# the simulation stack so the path matches what the mission would get.

map_server:
  ros__parameters:
    use_sim_time: false
    frame_id: map
    topic_name: map
    # Replaced by planner.launch.py's map: argument. RewrittenYaml only
    # overwrites keys that are already in the file, so this stays.
    yaml_filename: "set_by_planner_launch.yaml"

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 20.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_theta_star_planner/ThetaStarPlanner"
      how_many_corners: 8
      allow_unknown: false
      w_euc_cost: 1.0
      w_traversal_cost: 5.0
      use_final_approach_orientation: false

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: map
      robot_base_frame: base_footprint
      robot_radius: 0.3
      resolution: 0.05
      track_unknown_space: true
      update_frequency: 1.0
      publish_frequency: 1.0
      always_send_full_costmap: true
      plugins: ["static_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.5
        inflation_radius: 0.35
