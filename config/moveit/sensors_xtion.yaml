# Simulation octomap. launch/move_group.launch.py loads this by default;
# config/realrobot/moveit/sensors_xtion_remote.yaml is the real-robot counterpart.
# The default 10 cm voxels are larger than the can and the finger clearance.
octomap_resolution: 0.01
octomap_frame: odom
sensors:
  - head_rgbd_sensor

head_rgbd_sensor:
  sensor_plugin: hsr_rgbd/ConfiguredDepthUpdater
  # What move_group subscribes to. The launch remaps this topic and the
  # camera_info beside it to the depth relay's /octomap_camera outputs.
  image_topic: /head_rgbd_sensor/depth_registered/image_rect_raw
  queue_size: 5
  near_clipping_plane_distance: 0.15
  # 2.0 m (feat/pipeline): bounds the octomap move_group has to maintain.
  far_clipping_plane_distance: 2.0
  shadow_threshold: 0.04
  # Match the working robot self-filter; this does not shift grasp poses.
  padding_scale: 1.0
  padding_offset: 0.02
  max_update_rate: 1.0
  skip_vertical_pixels: 0
  skip_horizontal_pixels: 2
  filtered_cloud_topic: filtered_depth
  ns: rgbd_octomap

# Read by launch/move_group.launch.py, not by move_group: where hsr_rgbd's
# depth relay gets its frames and calibration. Gazebo bridges depth under a
# different name than the robot and publishes it reliable.
relay:
  depth_topic: /head_rgbd_sensor/depth_registered/image
  info_topic: /head_rgbd_sensor/depth_registered/camera_info
  sensor_data_qos: false
